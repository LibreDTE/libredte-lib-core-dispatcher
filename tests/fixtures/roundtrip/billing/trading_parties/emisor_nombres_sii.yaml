# Emisor enviado con los nombres de los campos del XML del SII (RUTEmisor,
# RznSoc, Acteco...). La salida serializada los entrega con nombres en
# snake_case, y esa salida se puede volver a recibir.
description: >
  Emisor enviado con los nombres de campo del SII.

body:
  RUTEmisor: '76192083-9'
  RznSoc: SASCO SpA
  GiroEmis: Desarrollo de software
  Acteco: 620200
  Telefono: '+56912345678'
  CorreoEmisor: contacto@example.com
  DirOrigen: Calle 123
  CmnaOrigen: Santiago
  CiudadOrigen: Santiago
  Sucursal: Casa Matriz
  CdgSIISucur: 1
  CdgVendedor: V01

test:
  type: libredte\lib\Core\Package\Billing\Component\TradingParties\Contract\EmisorInterface
  expect:
    rut: '76192083-9'
    razon_social: SASCO SpA
    giro: Desarrollo de software
    actividades_economicas.0: 620200
    telefonos.0: '+56912345678'
    email: contacto@example.com
    direccion: Calle 123
    sucursal: Casa Matriz
    codigo_sucursal: 1
    vendedor: V01
