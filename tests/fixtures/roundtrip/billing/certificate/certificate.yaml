# Certificado digital: el usuario envía el certificado y la llave privada en
# PEM. La salida serializada los entrega como `cert` y `pkey` (más `chain` y
# datos del certificado), y también se pueden volver a recibir.
description: >
  Certificado autofirmado de prueba enviado con certificate y privateKey.

body: "{{certificate}}"

test:
  type: Derafu\Certificate\Contract\CertificateInterface
  expect:
    is_active: true
    chain: []
