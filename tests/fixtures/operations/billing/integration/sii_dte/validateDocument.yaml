# billing.integration.sii_dte::validateDocument
#
# Valida en el SII si existe un documento con estos datos exactos (empresa,
# tipo, folio, fecha, monto, receptor). Los datos son inventados (folio y
# receptor no corresponden a un documento real emitido). Sin certificado
# real (CertificateFaker), falla en la autenticación (failure). Con
# certificado real, la autenticación tiene éxito y el SII responde con
# éxito (success) indicando que el folio no está autorizado.
description: >
  Valida un documento inventado (folio inexistente) contra el SII.

request:
  package: billing
  component: integration
  worker: sii_dte
  operation: validateDocument
  parameters:
    request:
      certificate: "{{siiCertificateRequest}}"
      options:
        environment: 1 # SiiEnvironment::STAGING (certificación).
    company: "{{siiCompanyRut}}"
    document: 33
    number: 999999999
    date: '2025-01-01'
    total: 1000
    recipient: '23456789-6'

expect:
  either:
    success:
      value_contains:
        # El folio 999999999 nunca existirá realmente, así que "received"
        # siempre debería ser false — es un hecho estructural del dato
        # inventado, no del entorno del SII en un momento dado.
        received: false
        # status/description sí dependen de la respuesta puntual del SII
        # (ej. "FNA" folio no autorizado) — solo se exige que la respuesta
        # real haya llegado con contenido, sin fijar el código exacto.
        status: '*'
        description: '*'
    failure:
      problem_title:
        # Con CertificateFaker (sin LIBREDTE_CERTIFICATE_FILE configurado) siempre
        # falla acá: el certificado autofirmado nunca está registrado en el SII.
        - libredte\lib\Core\Package\Billing\Component\Integration\Exception\SiiLazy\AuthenticateException
        # Con un certificado real configurado, la autenticación puede tener éxito
        # y fallar más adelante, en la operación específica.
        - libredte\lib\Core\Package\Billing\Component\Integration\Exception\SiiDte\ValidateDocumentException
