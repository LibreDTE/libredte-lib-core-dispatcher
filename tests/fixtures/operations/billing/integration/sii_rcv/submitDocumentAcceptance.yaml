# billing.integration.sii_rcv::submitDocumentAcceptance
#
# Informa al SII la aceptación/reclamo de un documento recibido, en el
# Registro de Compra y Venta. Con un folio inventado se espera `failure`
# en la práctica.
description: >
  Informa aceptación de contenido (ACD) de un documento inventado.

request:
  package: billing
  component: integration
  worker: sii_rcv
  operation: submitDocumentAcceptance
  parameters:
    request:
      certificate: "{{siiCertificateRequest}}"
      options:
        environment: 1 # SiiEnvironment::STAGING (certificación).
    company: "{{siiCompanyRut}}"
    document: 33
    number: 999999999
    action: ACD

expect:
  either:
    success:
      value_contains:
        codigo: '*'
        glosa: '*'
    failure:
      problem_title:
        # Con CertificateFaker (sin LIBREDTE_CERTIFICATE_FILE configurado) siempre
        # falla acá: el certificado autofirmado nunca está registrado en el SII.
        - libredte\lib\Core\Package\Billing\Component\Integration\Exception\SiiLazy\AuthenticateException
        # Con un certificado real configurado, la autenticación puede tener éxito
        # y fallar más adelante, en la operación específica.
        - libredte\lib\Core\Package\Billing\Component\Integration\Exception\SiiRcv\SubmitDocumentAcceptanceException
