# billing.exchange.sender::send
#
# Envía un sobre con un documento usando la estrategia configurada (por
# defecto SMTP). Sin credenciales de transporte, la estrategia rechaza el
# envío antes de intentar conectarse a ningún servidor — falla de forma
# determinística y sin red, a diferencia de los fixtures de `Integration`
# (que dependen de si hay o no un certificado real configurado).
description: >
  Intenta enviar un sobre por SMTP sin credenciales de transporte.

request:
  package: billing
  component: exchange
  worker: sender
  operation: send
  parameters:
    bag:
      options:
        strategy: email.smtp
        transport:
          username: ''
          password: ''
      envelopes:
        - sender:
            identifier:
              value: '76192083-9'
              schemeId: CL-RUT
            endpoints:
              - value: emisor@example.com
                schemeId: EMAIL
          receiver:
            identifier:
              value: '66666666-6'
              schemeId: CL-RUT
            endpoints:
              - value: cliente@example.com
                schemeId: EMAIL
          documentType: 'urn:fdc:libredte.cl:2025:doc:invoice'
          process: 'urn:fdc:libredte.cl:2025:poacc:billing'
          businessMessageID: envio-001
          documents:
            - type: 'urn:fdc:libredte.cl:2025:doc:invoice'
              content: ''

expect:
  failure:
    problem_title: libredte\lib\Core\Package\Billing\Component\Exchange\Exception\ExchangeException
