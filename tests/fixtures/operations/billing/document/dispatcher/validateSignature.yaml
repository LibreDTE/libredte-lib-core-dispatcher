# billing.document.dispatcher::validateSignature
#
# Mismo criterio que validate.yaml para `source`. Retorna un arreglo de
# `SignatureValidationResultInterface` (objetos de `derafu/signature`, no
# arreglos escalares) — solo se verifica éxito del despacho.
description: >
  Valida la firma XML de un sobre de envío (EnvioDTE) ya construido.

request:
  package: billing
  component: document
  worker: dispatcher
  operation: validateSignature
  parameters:
    source: "{{sobreEnvioXml}}"

expect:
  success: {}
