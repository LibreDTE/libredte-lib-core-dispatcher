# billing.document.renderer::render
#
# Renderiza un DTE ya construido a PDF. El valor de retorno ahora es un
# `RenderResultInterface` serializado ({renderings: [...]}, contenido en
# base64) — no el string binario crudo de antes. Sin la opción `renderings`,
# se genera una sola presentación (`tributaria`), igual que el
# comportamiento anterior a que existiera este concepto.
description: >
  Renderiza una factura afecta ya construida a PDF, con una sola
  presentación (la tributaria, por defecto).

request:
  package: billing
  component: document
  worker: renderer
  operation: render
  parameters:
    bag:
      xmlDocument: "{{facturaAfectaXml}}"
      options:
        renderer:
          format: pdf

expect:
  success:
    value_contains:
      renderings.0.label: tributaria
      renderings.0.mimeType: application/pdf
      renderings.0.copies: 1
      renderings.0.copyNumber: 1
      renderings.0.content: '*'
      renderings.0.filename: '*'
    value_matches_jmespath:
      "length(renderings)": 1
