# billing.document.batch_processor::parse
#
# El contenido del lote tiene una fila con un folio inválido (`abc`), que el
# parser del CSV rechaza. La operación debe fallar con `BatchProcessorException`.
description: >
  Un CSV de emisión masiva con un folio inválido falla con
  BatchProcessorException.

request:
  package: billing
  component: document
  worker: batch_processor
  operation: parse
  parameters:
    batch:
      # TipoDTE;Folio;...;PrcItem, con `33;abc;...` (base64).
      inputData: ""

expect:
  failure:
    problem_title: libredte\lib\Core\Package\Billing\Component\Document\Exception\BatchProcessorException
