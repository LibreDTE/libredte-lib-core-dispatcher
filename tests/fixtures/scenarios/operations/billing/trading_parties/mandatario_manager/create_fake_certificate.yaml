# billing.trading_parties.mandatario_manager::create_fake_certificate
#
# Genera un certificado ficticio para un mandatario dado.
description: >
  Genera un certificado falso para un mandatario de prueba.

steps:
  request:
    dispatch:
      operation: billing.trading_parties.mandatario_manager::create_fake_certificate
      parameters:
        mandatario:
          run: '76192083-9'
          nombre: SASCO SpA
          email: contacto@example.com
    expect:
      name: SASCO SpA
      email: contacto@example.com
      is_active: true
