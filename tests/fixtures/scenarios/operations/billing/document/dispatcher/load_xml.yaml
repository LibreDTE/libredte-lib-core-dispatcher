# billing.document.dispatcher::load_xml
#
# Carga un sobre de envío (EnvioDTE) desde su XML y entrega sus datos: el tipo
# de sobre, su XML, los documentos que contiene y su carátula, que se lee del
# propio XML.
description: >
  Carga un sobre de envío con una factura afecta, ya construido y firmado.

steps:
  request:
    dispatch:
      operation: billing.document.dispatcher::load_xml
      parameters:
        xml: !fixture sobre_envio_xml
    expect:
      tag: EnvioDTE
      xml: !any
      'caratula.RutEmisor': '76192083-9'
      'caratula.RutReceptor': '66666666-6'
      "length(documents)": 1
