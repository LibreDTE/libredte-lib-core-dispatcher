# CAF: `caf_loader::load` recibe el XML en base64 y entrega el CAF; su clave
# `xml` (también en base64) se reenvía a `caf_validator::validate`, que recibe
# un CAF y devuelve un CAF. Los dos resultados deben ser iguales.
description: >
  Carga un CAF de una factura afecta y lo reenvía a la validación del CAF.

steps:
  first:
    dispatch:
      operation: billing.identifier.caf_loader::load
      parameters:
        xml: !fixture caf_factura_afecta
    expect:
      tipo_documento: 33
      'emisor.rut': '76192083-9'

  second:
    dispatch:
      operation: billing.identifier.caf_validator::validate
      parameters:
        caf: !ref first.value.xml
    expect:
      '@': !ref first.value
