description: >
  Rechaza un dato que no es un string.

steps:
  rejected:
    deserialize:
      type: Derafu\Xml\Contract\XmlDocumentInterface
      data:
        not: a string
    failure:
      exception: Derafu\BackboneDispatcher\Exception\NoDeserializerFoundException
      caused_by: Derafu\BackboneDispatcher\Exception\UnsupportedDataTypeException
