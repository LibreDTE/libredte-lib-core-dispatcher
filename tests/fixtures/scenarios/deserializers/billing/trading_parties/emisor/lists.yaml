description: >
  Acepta las listas actividades_economicas y telefonos (la forma de la serialización), y usa su primer elemento.

steps:
  build:
    deserialize:
      type: libredte\lib\Core\Package\Billing\Component\TradingParties\Contract\EmisorInterface
      data:
        rut: '76192083-9'
        razon_social: SASCO SpA
        actividades_economicas: [620200, 471100]
        telefonos: ['+56911111111', '+56922222222']
    expect:
      call:
        getActividadEconomica(): 620200
        getTelefono(): '+56911111111'
